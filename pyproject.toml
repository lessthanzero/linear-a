[project]
name = "linear-a"
version = "0.1.0"
description = "Computational research laboratory and epigraphic decipherment harness for Linear A"
authors = [
    { name = "Alexander Katin", email = "aleksandr.katin@gmail.com" }
]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "networkx>=3.3",
    "matplotlib>=3.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
linear-a = "linear_a.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
