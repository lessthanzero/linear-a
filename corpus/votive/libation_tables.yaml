    date_range: "MM III / LM IA"
    object_type: "libation_vessel"
    vessel_type: "Stone libation ladle (steatite)"
    source: "GORILA IV: 18-19; Karetsou 1974"
    transcription_raw: "A-TA-I-*301-WA-JA JA-SA-SA-RA-ME U-NA-KA-NA-SI I-PI-NA-MA SI-RU-TE"
    segments:
      - word: "A-TA-I-*301-WA-JA"
        morae: 6
        role: "Formulaic invocation header / Divine title"
        prefix: "A-"
      - word: "JA-SA-SA-RA-ME"
        morae: 5
        role: "Great Goddess invocation ('Our Lady' / Asherah parallel)"
        prefix: "JA-"
        geminate: true
      - word: "U-NA-KA-NA-SI"
        morae: 5
        role: "Dedicatory verb ('she has offered / may she accept')"
        prefix: "U-"
      - word: "I-PI-NA-MA"
        morae: 4
        role: "Libation offering / sacred liquid descriptor"
        prefix: "I-"
      - word: "SI-RU-TE"
        morae: 3
        role: "Priestly / sanctuary locative title"
        suffix: "-TE"

