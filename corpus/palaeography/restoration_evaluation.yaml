limitations: >-
  These entries are transcriptions and restoration hypotheses already encoded in
  this repository, with bibliography copied from the associated catalog. They
  are not an independently adjudicated scholarly gold standard. Scores produced
  from this file measure agreement with this project-curated reference set only.
annotation_classes:
  project_curated_restoration: A damaged token with a repository-curated reference completion.
  legible_control: A fully legible curated token suitable for synthetic masking tests.
  unresolved: A damaged token with no reference completion; excluded from accuracy denominators.
